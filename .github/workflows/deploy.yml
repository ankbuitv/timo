name: Deploy

# Triển khai CHỈ khi CI đã thành công trên cùng commit. Không tự động deploy production.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Môi trường đích"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # Dùng GitHub Environment có secrets riêng + reviewer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Kiểm tra cấu hình (chặn nếu còn placeholder)
        run: node infrastructure/scripts/verify-deploy-config.mjs "${{ inputs.environment }}"

      - name: Build
        run: pnpm run build

      - name: Áp dụng migration lên D1 (remote)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply timo-main --remote --env ${{ inputs.environment }}

      - name: Deploy Worker API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env ${{ inputs.environment }}

      - name: Kiểm tra sức khỏe sau deploy
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then echo "::error::Thiếu biến API_HEALTH_URL"; exit 1; fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$API_HEALTH_URL/api/health" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 5
          done
          echo "::error::Health check thất bại – xem docs/DEPLOYMENT.md mục Rollback"; exit 1
