name: Migrate D1 (thủ công)

# Áp dụng migration D1 lên môi trường thật. TÁCH khỏi deploy để có bước phê duyệt riêng.
# Yêu cầu: (1) chọn môi trường, (2) gõ đúng cụm xác nhận "MIGRATE-<env>", (3) GitHub Environment
# đã cấu hình required reviewers (duyệt trước khi job chạy). KHÔNG chạy tự động.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Môi trường đích"
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: "Gõ MIGRATE-staging hoặc MIGRATE-production để xác nhận"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: Kiểm tra cụm xác nhận
    runs-on: ubuntu-latest
    steps:
      - name: Xác nhận đúng cụm
        env:
          CONFIRM: ${{ inputs.confirm }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "MIGRATE-$ENV_NAME" ]; then
            echo "::error::Cụm xác nhận không khớp. Phải gõ đúng MIGRATE-$ENV_NAME"; exit 1
          fi

  migrate:
    name: Migrate ${{ inputs.environment }}
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # GitHub Environment có reviewer + secrets riêng
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra CI đã xanh trên đúng commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion=="success")] | length' || echo 0)
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::Không tìm thấy CI thành công cho commit $GITHUB_SHA"; exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Kiểm tra cấu hình và manifest migration
        run: |
          node infrastructure/scripts/verify-deploy-config.mjs "${{ inputs.environment }}"
          node infrastructure/scripts/migration-manifest.mjs --check

      - name: Xem trước migration đang chờ
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations list timo-main --remote --env ${{ inputs.environment }}

      - name: Áp dụng migration (remote)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply timo-main --remote --env ${{ inputs.environment }}
