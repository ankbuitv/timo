name: CI

# Chạy trên mọi pull request và push vào main. Không dùng secret bí mật ở đây.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kiểm tra mã nguồn (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cài đặt phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: Manifest migration (migration đã áp dụng không được sửa)
        run: node infrastructure/scripts/migration-manifest.mjs --check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit & integration tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Áp dụng migration lên D1 cục bộ (kiểm tra SQL thật bằng workerd)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply timo-main --local

      - name: Kiểm tra cấu hình production (cảnh báo, không chặn CI)
        run: node infrastructure/scripts/verify-deploy-config.mjs production || echo "::warning::Cấu hình production chưa hoàn tất"
